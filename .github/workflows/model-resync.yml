name: Model resync

on:
  schedule:
    # Mondays 03:50 UTC
    - cron: "50 3 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  resync:
    name: Resync model metadata
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Compile bundled metadata
        run: npm run compile
      - name: Compare bundled pricing with models.dev
        run: node scripts/refresh-models.mjs --ci --report-file model-resync-report.md
      - name: Create resync pull request
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          branch: resync/model-metadata
          delete-branch: true
          title: Resync model metadata from live sources
          commit-message: Resync model metadata
          body-path: model-resync-report.md
          add-paths: |
            src/
            .changeset/
          labels: |
            automation
            model-metadata
